<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="unityhub">
  <title>unityhub — Nachbarschaften</title>
  <!-- Gruppen unterschiedlicher Dichte, lose um eine Mitte gelegt: ein Verein
       ist in Nachbarschaften gegliedert, und die sind verschieden gross. -->
  <g fill="#0428cb">
    <!-- dichte Mitte -->
    <circle cx="24" cy="24" r="2.6"/>
    <circle cx="19.4" cy="21.6" r="1.9"/>
    <circle cx="28.4" cy="21.2" r="1.7"/>
    <circle cx="21.6" cy="28.4" r="1.7"/>
    <circle cx="27.6" cy="28.8" r="2.1"/>
    <!-- Gruppe oben -->
    <circle cx="24" cy="9.2" r="2.2"/>
    <circle cx="19.2" cy="11.8" r="1.4"/>
    <circle cx="28.8" cy="11.6" r="1.4"/>
    <!-- Gruppe rechts -->
    <circle cx="38.6" cy="24" r="1.9"/>
    <circle cx="36.2" cy="18.6" r="1.3"/>
    <circle cx="36.4" cy="29.6" r="1.3"/>
    <!-- Gruppe links -->
    <circle cx="9.4" cy="24" r="1.9"/>
    <circle cx="11.8" cy="18.8" r="1.3"/>
    <circle cx="11.6" cy="29.4" r="1.3"/>
    <!-- Gruppe unten -->
    <circle cx="24" cy="38.8" r="1.6"/>
    <circle cx="18.8" cy="36.4" r="1.2"/>
  </g>
  <!-- Zwei Punkte leuchten. Die Vorlage verlangt, dass Cyan wie ein Lichtbogen
       wirkt und nicht wie Flaechenfarbe. -->
  <g fill="#34fcff">
    <circle cx="29.6" cy="36.2" r="1.4"/>
    <circle cx="33.4" cy="13.4" r="1.2"/>
  </g>
</svg>
