<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="unityhub">
  <title>unityhub — Knotenpunkt</title>
  <!-- Ein Mittelpunkt, an dem Vereine haengen. Die Linien sind duenn genug,
       um bei 16 Pixeln zu verschwinden, ohne dass das Zeichen zerfaellt --
       die Knoten allein tragen es dann. -->
  <g stroke="#0428cb" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M24 24 L24 10"/>
    <path d="M24 24 L36.1 17"/>
    <path d="M24 24 L36.1 31"/>
    <path d="M24 24 L24 38"/>
    <path d="M24 24 L11.9 31"/>
    <path d="M24 24 L11.9 17"/>
  </g>
  <g fill="#0428cb">
    <circle cx="24" cy="10"   r="3.1"/>
    <circle cx="36.1" cy="17" r="3.1"/>
    <circle cx="36.1" cy="31" r="3.1"/>
    <circle cx="24" cy="38"   r="3.1"/>
    <circle cx="11.9" cy="31" r="3.1"/>
  </g>
  <circle cx="11.9" cy="17" r="3.1" fill="#34fcff"/>
  <circle cx="24" cy="24" r="5.6" fill="#0428cb"/>
  <circle cx="24" cy="24" r="2.2" fill="#00052e"/>
</svg>
