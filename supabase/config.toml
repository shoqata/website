
# send-mail-queue prueft selbst, wer aufrufen darf: entweder das in
# mail_settings erzeugte Zeitplan-Kennwort, oder eine angemeldete Person mit
# Verwaltungsrolle. Ohne eines von beidem antwortet sie 403 -- von aussen
# geprueft. Die vorgeschaltete JWT-Pruefung muss deshalb aus, sonst kaeme der
# Zeitplan gar nicht erst bis zu dieser Kontrolle: pg_cron schickt kein JWT.
[functions.send-mail-queue]
verify_jwt = false

# Pingen ruft den Webhook ohne Supabase-Token auf -- es kennt keines. Die
# Pruefung macht die Funktion selbst: hex-HMAC-SHA256 ueber den ROHEN
# Koerper gegen PINGEN_WEBHOOK_SECRET, in konstanter Zeit verglichen.
# Ohne dieses Geheimnis nimmt sie gar nichts an (503) -- sie ist also
# nicht offen, sondern anders verschlossen.
[functions.pingen-webhook]
verify_jwt = false

# Der Arbeiter wird vom Zeitplan (ohne Anmeldung, mit Zeitplan-Kennwort)
# und aus der Verwaltung (mit Anmeldung) gerufen. Wie bei send-mail-queue
# prueft er selbst, wer aufrufen darf -- ohne eines von beidem antwortet
# er 401. Die vorgeschaltete Pruefung muss deshalb aus, sonst kaeme der
# Zeitplan nie an.
[functions.pingen-versand]
verify_jwt = false
