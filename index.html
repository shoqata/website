
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koretini</title>
    <script>
      // Wem gehoert diese Adresse?
      //
      // Die Zuordnung steht in der Datenbank und kostet eine Anfrage -- zu
      // spaet fuer den ersten Anstrich. Das Ergebnis des letzten Besuchs
      // liegt deshalb im Speicher dieser Herkunft und wird hier synchron
      // gelesen, bevor irgendetwas erscheint. localStorage ist pro Herkunft
      // getrennt, koretini.me und unityhub.li koennen sich also nicht
      // vertauschen.
      //
      // Beim allerersten Besuch ist nichts bekannt: dann bleibt es bei
      // 'unbekannt', einem ruhigen Grund ohne Bekenntnis zu einer der beiden
      // Welten. Sich hier auf den Verein festzulegen war der Grund, weshalb
      // auf unityhub.li zuerst Koretini erschien.
      (function () {
        var stand = 'unbekannt';
        try {
          var wert = localStorage.getItem('verein-fuer-diese-domain');
          if (wert !== null) stand = wert === '' ? 'plattform' : 'verein';
        } catch (e) { /* privater Modus: dann eben ohne Gedaechtnis */ }
        document.documentElement.dataset.domain = stand;
        if (stand === 'plattform') {
          document.title = 'unityhub';
        } else if (stand === 'unbekannt') {
          // Beim allerersten Besuch ist noch nicht bekannt, wem die Adresse
          // gehoert. Der fest hinterlegte Titel "Koretini" waere auf
          // unityhub.li falsch, also steht hier so lange die Adresse selbst
          // -- neutral und in jedem Fall zutreffend. Im ausgelieferten HTML
          // bleibt "Koretini" stehen, was fuer Suchmaschinen auf koretini.me
          // richtig ist; erst dieses Skript ersetzt ihn.
          document.title = window.location.hostname.replace(/^www\./, '');
        }
      })();
    </script>
    <script>
      // Der Router arbeitet mit Rauten-Adressen (/#/...). Damit sich auch saubere
      // Adressen teilen lassen -- koretini.me/fussball/sponsoren statt
      // koretini.me/#/fussball/sponsoren -- wird ein Pfad ohne Raute einmalig
      // umgeschrieben. Bestehende Rauten-Links bleiben unveraendert gueltig.
      (function () {
        var pfad = window.location.pathname;
        if (pfad !== '/' && !window.location.hash) {
          var sauber = pfad.replace(/\/+$/, '') || '/';
          window.location.replace('/#' + sauber + window.location.search);
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
      /* Vereinsdarstellung -- die Vorgabe. */
      :root {
        --primary: #f43f5e;
        --primary-hover: #e11d48;
        --secondary: #1c1917;
        --accent: #faf9f6;
        --kontrast: #1c1917;  /* lesbare Tinte auf --accent */
      }

      /* Betreiberdarstellung. Dieselben Namen, andere Werte: was sie
         verwendet -- Grundflaechen, Ladeanzeige, Cookie-Hinweis -- wechselt
         damit mit, ohne dass jede Stelle die Domain kennen muss. Die Werte
         entsprechen components/platform/farben.ts; beide zusammen zu aendern
         ist Absicht, ein Stylesheet kann kein Modul einlesen. */
      :root[data-domain="plattform"] {
        --primary: #0428cb;
        --primary-hover: #0620a0;
        --secondary: #00052e;
        --accent: #00052e;
        --kontrast: #ffffff;
      }

      /* Noch nicht bekannt: ein ruhiger Grund, der zu keiner der beiden
         Welten gehoert. Er steht nur beim allerersten Besuch und nur, bis
         die Datenbank geantwortet hat. */
      :root[data-domain="unbekannt"] {
        --accent: #ffffff;
        --kontrast: #1c1917;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--accent);
        color: #1a1a1a;
        margin: 0;
      }
      .font-display {
        font-family: 'Playfair Display', serif;
      }
      .glass {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      
      /* Bedienelemente, die die Hausfarbe tragen. Sie haengen an denselben
         Variablen wie alles andere und wechseln damit die Welt mit, ohne
         dass die Stelle im Code die Domain kennen muss. Vorher standen hier
         feste rose-Werte -- Koretinis Farbe, auch auf unityhub.li. */
      .knopf-primaer {
        background-color: var(--primary);
        box-shadow: 0 18px 36px -14px color-mix(in srgb, var(--primary) 45%, transparent);
      }
      .knopf-primaer:hover { background-color: var(--primary-hover); }
      .feld-primaer:focus {
        border-color: color-mix(in srgb, var(--primary) 32%, transparent);
      }
      .zu-primaer:hover { color: var(--primary); }
      .tupfer-primaer {
        background-color: color-mix(in srgb, var(--primary) 12%, transparent);
        color: var(--primary);
      }
      .linie-primaer { border-color: color-mix(in srgb, var(--primary) 25%, transparent); }

      .bg-primary { background-color: var(--primary); }
      .bg-secondary { background-color: var(--secondary); }
      .text-primary { color: var(--primary); }
      .border-primary { border-color: var(--primary); }

      @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      .animate-blob {
        animation: blob 7s infinite;
      }
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #d4d4d4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
